worker_processes auto;
pid /run/ctmc-quality-web.pid;
error_log /var/log/ctmc-quality-web-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    access_log /var/log/ctmc-quality-web-access.log;

    server {
        listen 8088;
        server_name _;
        root /srv/ctmc-quality/current/portal-dist;
        index index.html;
        charset utf-8;
        absolute_redirect off;
        client_max_body_size 70m;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /failure-analysis {
            return 301 /failure-analysis/;
        }

        location = /_platform_auth_failure {
            internal;
            proxy_pass http://127.0.0.1:8010/auth/authorize?permission=failure;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /_platform_auth_machine_watch {
            internal;
            proxy_pass http://127.0.0.1:8010/auth/authorize?permission=machine_watch;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /_platform_auth_assembly_sq {
            internal;
            proxy_pass http://127.0.0.1:8010/auth/authorize?permission=assembly_sq;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location @platform_login {
            return 302 /?next=$request_uri;
        }

        location ^~ /failure-analysis/ {
            auth_request /_platform_auth_failure;
            error_page 401 403 = @platform_login;
            try_files $uri $uri/ /failure-analysis/index.html;
        }

        location = /machine-watch {
            return 301 /machine-watch/;
        }

        location ^~ /machine-watch/ {
            auth_request /_platform_auth_machine_watch;
            error_page 401 403 = @platform_login;
            try_files $uri $uri/ /machine-watch/index.html;
        }

        location = /assembly-sq-dashboard {
            return 301 /assembly-sq-dashboard/;
        }

        location ^~ /assembly-sq-dashboard/ {
            auth_request /_platform_auth_assembly_sq;
            error_page 401 403 = @platform_login;
            try_files $uri $uri/ /assembly-sq-dashboard/index.html;
        }

        location = /trace {
            return 302 https://quality-ctmc.cloud/trace/;
        }

        location ^~ /trace/ {
            if ($http_x_forwarded_proto != "https") {
                return 302 https://quality-ctmc.cloud$request_uri;
            }
            proxy_pass http://127.0.0.1:8789/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }

        # CGI vehicle service: independent permission; existing routes unchanged.
        location = /vehicle { return 302 /vehicle/; }
        location = /_platform_auth_vehicle {
            internal;
            proxy_pass http://127.0.0.1:8010/auth/authorize?permission=vehicle;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }
        # BEGIN CTMC vehicle offline streamed upload
        location = /vehicle/api/offline/analyze {
            auth_request /_platform_auth_vehicle;
            proxy_pass http://127.0.0.1:8790/api/offline/analyze;
            proxy_http_version 1.1;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
            client_max_body_size 12g;
            client_body_timeout 600s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
        }
        # END CTMC vehicle offline streamed upload
        location ^~ /vehicle/api/ {
            auth_request /_platform_auth_vehicle;
            proxy_pass http://127.0.0.1:8790/api/;
            proxy_http_version 1.1;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
            proxy_read_timeout 90s;
            client_max_body_size 32k;
        }
        location ^~ /vehicle/ {
            auth_request /_platform_auth_vehicle;
            error_page 401 = @platform_login;
            proxy_pass http://127.0.0.1:8790/;
            proxy_http_version 1.1;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
        }

        location /platform-api/ {
            proxy_pass http://127.0.0.1:8010/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }

        location /failure-analysis-api/ {
            auth_request /_platform_auth_failure;
            proxy_pass http://127.0.0.1:8010/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }
}
